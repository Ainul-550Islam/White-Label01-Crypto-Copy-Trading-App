# Responsibility: the reviewed secret-scanning policy — every accepted finding is a specific, synthetic value, never a rule or a path suppressed wholesale.
# gitleaks configuration. `gitleaks detect` with this file is the gate: it fails on anything the
# default ruleset finds that is not one of the exact values below.
#
# The finding this file answers was 160 matches across the git history. Reviewing them took reading the
# values, and every one of them is synthetic: documentation examples (`sk_live_0123456789abcdefghij` in
# a handover doc that has since been deleted from the tree but remains in history), unit-test fixtures
# (`AKEY-12345678`, `leader-fee-policy-key-0001`), an algorithm name matched by a JWT heuristic, and an
# explicit `replace-me-with-64-hex-characters-generated-fresh` placeholder in .env.staging.example.
#
# Why exact values rather than `paths` or rule-level exclusions: a path allowlist for docs/ would hide
# the next real key somebody pastes into a handover document, which is exactly the accident this gate
# exists to catch. An entry below suppresses one reviewed string and nothing else, so a different value
# in the same file still fails the scan. Adding a value here is a reviewed decision: it belongs in a
# commit with a reason, and a real credential never belongs here at all — it belongs rotated.
#
# `regexTarget = "secret"` compares against the captured secret rather than the surrounding line, so
# the match cannot be widened by editing neighbouring text.

# `useDefault` is not optional and its absence is not obvious: a config file *replaces* the ruleset,
# so without this line the scan finds nothing - including a real secret - and reports success. That
# failure mode was measured while writing this file: a planted `ghp_…` token in docs/ was invisible
# until [extend] useDefault was set.
[extend]
useDefault = true

