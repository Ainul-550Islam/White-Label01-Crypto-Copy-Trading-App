[[allowlists]]
description = "Generated test key material. apps/api/.generated/ is gitignored (.gitignore:40) and written at test time by apps/api/test/sso-test-keys.global-setup.js, so it never reaches a commit - and `gitleaks dir`/`--no-git` do not read .gitignore, so a working-tree scan would otherwise report it on every run. A path allowlist is used only here and only because `git check-ignore` proves the path is untracked; the test suite asserts that every path entry in this file satisfies that."
paths = ['''apps/api/\.generated/''']
