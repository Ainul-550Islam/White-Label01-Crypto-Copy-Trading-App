[package]
name = "wlct-sdk"
version = "1.0.0"
edition = "2021"
description = "Typed Rust SDK for the white-label developer platform API"

[dependencies]
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
