# Responsibility: enforce repeatable secret, dependency, Python, and filesystem security scans for the nested application repository.
name: Infrastructure Security Scans

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: infra-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation and service environment parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
      - name: Install Node dependencies and build shared schemas
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:packages
      - name: Format, initialize without backend, and validate Terraform
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace/infra/production/terraform hashicorp/terraform:1.9.8 fmt -check -recursive
          docker run --rm -v "$PWD:/workspace" -w /workspace/infra/production/terraform hashicorp/terraform:1.9.8 init -backend=false -input=false
          docker run --rm -v "$PWD:/workspace" -w /workspace/infra/production/terraform hashicorp/terraform:1.9.8 validate
      - name: Validate API and service environment contracts
        run: |
          node scripts/check-terraform-api-env.mjs
          node scripts/check-terraform-services-env.mjs

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run static chart checks, lint, and render
        run: |
          set -euo pipefail
          node scripts/check-helm-chart.mjs
          docker run --rm -v "$PWD/infra/production/helm/wlct:/chart:ro" alpine/helm:3.15.4 lint /chart
          docker run --rm -v "$PWD/infra/production/helm/wlct:/chart:ro" alpine/helm:3.15.4 template wlct /chart > "$RUNNER_TEMP/wlct-rendered.yaml"

  gateway:
    name: Rust low-latency gateway checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Format, lint, and test gateway
        run: |
          set -euo pipefail
          cargo +1.88.0 fmt --manifest-path services/low-latency-gateway/Cargo.toml --check
          cargo +1.88.0 clippy --manifest-path services/low-latency-gateway/Cargo.toml --locked -- -D warnings
          cargo +1.88.0 test --manifest-path services/low-latency-gateway/Cargo.toml --locked
      - name: Build gateway container
        run: docker build -f infrastructure/docker/low-latency-gateway.Dockerfile -t wlct-low-latency-gateway:ci .

  sdk:
    name: Generated SDK contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated OpenAPI and SDK contracts
        run: |
          set -euo pipefail
          node scripts/check-openapi-drift.mjs
          (cd packages/sdk-typescript && npm run build && npm test)
          (cd packages/sdk-python && python3 -m pip install --disable-pip-version-check '.[dev]' && python3 scripts/generate.py --check && python3 -m pytest -q)

  production-compose:
    name: Single-VM production Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production Compose merge
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Validate deployment shell syntax
        run: bash -n scripts/deploy-single-vm.sh

  secrets:
    name: Gitleaks tree and history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks and verify archive checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          printf '%s  %s\n' \
            5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan working tree (missing scanner is blocked, never clean)
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: node scripts/secret-scan.mjs --tree
      - name: Scan full Git history (missing scanner is blocked, never clean)
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: node scripts/secret-scan.mjs --history
      - name: Test clean-tree and planted-secret detection
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: node --test scripts/secret-scan.test.mjs

  deps:
    name: npm dependency audit and SBOM drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce reviewed dependency audit baseline
        run: node scripts/check-dependency-audit.mjs
      - name: Verify committed SPDX SBOM
        run: node scripts/generate-sbom.mjs --check whitelabel-sbom.spdx.json

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned pip-audit
        run: python3 -m pip install --disable-pip-version-check pip-audit==2.7.3
      - name: Audit each Python service dependency file and trading-core runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requirements < <(find services -mindepth 2 -maxdepth 2 -type f -name requirements.txt -print | sort)
          test "${#requirements[@]}" -gt 0
          for file in "${requirements[@]}"; do
            echo "Auditing $file"
            python3 -m pip_audit -r "$file"
          done
          generated_requirements="$(mktemp)"
          trap 'rm -f "$generated_requirements"' EXIT
          python3 - <<'PY' > "$generated_requirements"
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path("libs/trading-core/pyproject.toml").read_text())
          for dependency in project["project"].get("dependencies", []):
              print(dependency)
          PY
          echo "Auditing libs/trading-core runtime dependencies"
          python3 -m pip_audit -r "$generated_requirements"

  images:
    name: Trivy filesystem scan (HIGH/CRITICAL, fix available)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan source, lockfiles, Dockerfiles, and infrastructure with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.57.1 fs \
            --scanners vuln,misconfig,secret \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /src
