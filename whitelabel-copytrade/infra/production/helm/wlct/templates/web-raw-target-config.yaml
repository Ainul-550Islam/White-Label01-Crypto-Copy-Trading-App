# The web server's router normalizes request targets before route handlers run.
# A mandatory, unprivileged sidecar checks the original target first; this does
# not depend on ingress-nginx's optional (and often disabled) snippet support.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-raw-target
  labels: {{- include "wlct.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log stderr warn;
    events { worker_connections 1024; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      map $uri $is_fee_target {
        default 0;
        ~^/api/proxy/(?:[^/]+/)?public/fee-schedule$ 1;
      }
      map $request_uri $is_canonical_fee_target {
        default 0;
        ~^/api/proxy/(?:v[0-9]+/)?public/fee-schedule(?:\?.*)?$ 1;
      }
      map "$is_fee_target:$is_canonical_fee_target" $reject_noncanonical {
        default 0;
        "1:0" 1;
      }
      server {
        listen 8080;
        client_max_body_size 10m;
        if ($reject_noncanonical) { return 400; }
        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_pass http://127.0.0.1:3001;
        }
      }
    }
