# TLS ingress routes only browser and API hostnames; the secret is pre-created by the platform operator.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-public
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts: [{{ .Values.hosts.api | quote }}, {{ .Values.hosts.app | quote }}, {{ .Values.hosts.admin | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.hosts.api | quote }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 4000 } } } }] }
    - host: {{ .Values.hosts.app | quote }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-web, port: { number: 3001 } } } }] }
    - host: {{ .Values.hosts.admin | quote }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-admin-web, port: { number: 3000 } } } }] }
