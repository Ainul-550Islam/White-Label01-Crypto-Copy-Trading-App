# Deploy the administrator console separately from customer-facing web sessions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-admin-web
  labels: {{- include "wlct.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.adminWeb.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: admin-web }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: admin-web }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: admin-web
          image: {{ include "wlct.image" .Values.services.adminWeb | quote }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: API_BASE_URL
              value: http://{{ .Release.Name }}-api:4000/api
          envFrom: [{ secretRef: { name: {{ .Values.services.adminWeb.secretRef | quote }} } }]
          startupProbe: { httpGet: { path: /login, port: http }, failureThreshold: 30, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.services.adminWeb.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001, capabilities: { drop: [ALL] } }
