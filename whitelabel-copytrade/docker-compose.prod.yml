# Production-only image, resource, health and ingress overrides; compose with docker-compose.yml.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G
  redis:
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
  migrate:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/api:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    restart: "no"
  api:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/api:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    ports: !reset []
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public&connection_limit=20&pool_timeout=20"
      DIRECT_DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public"
      EXECUTION_ENABLED: "${EXECUTION_ENABLED:-false}"
      EXCHANGE_SANDBOX_MODE: "${EXCHANGE_SANDBOX_MODE:-true}"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
  worker:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/api:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public&connection_limit=10&pool_timeout=20"
      DIRECT_DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
  notification-service:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/notification-service:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
  trading-engine:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/trading-engine:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    ports: !reset []
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public&connection_limit=20&pool_timeout=20"
      DIRECT_DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public"
      EXECUTION_ENABLED: "${EXECUTION_ENABLED:-false}"
      EXCHANGE_SANDBOX_MODE: "${EXCHANGE_SANDBOX_MODE:-true}"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
  execution-engine:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/execution-engine:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    ports: !reset []
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public&connection_limit=20&pool_timeout=20"
      DIRECT_DATABASE_URL: "postgresql://wlct_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wlct}?schema=public"
      EXECUTION_ENABLED: "${EXECUTION_ENABLED:-false}"
      EXCHANGE_SANDBOX_MODE: "${EXCHANGE_SANDBOX_MODE:-true}"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
  market-data:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/market-data:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
  admin-web:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/admin-web:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
  web:
    build: !reset null
    image: "${REGISTRY:?REGISTRY must be a private registry}/web:${IMAGE_TAG:?IMAGE_TAG must be a pinned release tag}"
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
  edge:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN must be set to the public root domain}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL must be set for certificate notices}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    networks:
      - wlct-edge
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local
