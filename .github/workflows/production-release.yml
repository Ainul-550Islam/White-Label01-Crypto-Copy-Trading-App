# Responsibility: validate the release.yml evidence bundle, require the production environment review, and deploy only the image digests recorded in that approved manifest.
name: Production release

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the validated release after production environment approval.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.8.5

jobs:
  validate-release-artifact:
    name: Validate the release manifest and SBOM from release.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the immutable release evidence bundle
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence

      - name: Verify the manifest belongs to this run and names only immutable images
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY_EOF'
          import json
          import os
          import pathlib
          import re

          manifest_path = pathlib.Path('release-evidence/release-manifest.json')
          sbom_path = pathlib.Path('release-evidence/release-sbom.spdx.json')
          if not manifest_path.is_file() or not sbom_path.is_file():
              raise SystemExit('release evidence is incomplete: both manifest and SBOM are required')

          with manifest_path.open(encoding='utf-8') as handle:
              manifest = json.load(handle)
          with sbom_path.open(encoding='utf-8') as handle:
              sbom = json.load(handle)

          if manifest.get('schema') != 'wlct-release-manifest-v1':
              raise SystemExit('unsupported release manifest schema')
          if manifest.get('commitSha') != os.environ['EXPECTED_COMMIT']:
              raise SystemExit('release manifest commitSha does not match the commit being released')
          if manifest.get('ref') != os.environ['EXPECTED_REF']:
              raise SystemExit('release manifest ref does not match the triggering tag')
          if manifest.get('IMAGE_NAME', '').lower() != os.environ['EXPECTED_REPOSITORY'].lower():
              raise SystemExit('release manifest repository does not match this GitHub repository')

          expected = {
              'api',
              'admin-web',
              'web',
              'notification-service',
              'trading-engine',
              'market-data',
              'execution-engine',
          }
          images = manifest.get('images')
          if not isinstance(images, dict) or set(images) != expected:
              raise SystemExit('release manifest does not contain the exact expected image set')
          for component, reference in sorted(images.items()):
              if not isinstance(reference, str) or not re.fullmatch(
                  r'ghcr\.io/[a-z0-9./_-]+@sha256:[a-f0-9]{64}', reference
              ):
                  raise SystemExit(f'{component} is not pinned to a valid GHCR sha256 digest: {reference!r}')
              print(f'{component}: {reference}')

          if sbom.get('spdxVersion') != 'SPDX-2.3' or not isinstance(sbom.get('packages'), list):
              raise SystemExit('release SBOM is not a valid SPDX-2.3 package document')
          print(f'Validated {len(images)} digest-pinned images and {len(sbom["packages"])} SBOM packages.')
          PY_EOF

  approval-gate:
    name: Verify the artifact presented for production approval
    needs: validate-release-artifact
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the exact evidence approved for this run
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence

      - name: Print and bind the approval summary to the release commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY_EOF'
          import json
          import os

          with open('release-evidence/release-manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          if manifest.get('commitSha') != os.environ['EXPECTED_COMMIT']:
              raise SystemExit('refusing production approval for an artifact from another commit')
          print('Production approval is for commit', manifest['commitSha'], 'at', manifest['ref'])
          for name, reference in sorted(manifest['images'].items()):
              print(f'  {name}: {reference}')
          print('Attached SBOM: release-sbom.spdx.json')
          PY_EOF

  deploy:
    name: Deploy to production (environment approval required)
    needs: approval-gate
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: whitelabel-copytrade/infra/production/terraform
    steps:
      - name: Checkout the exact released commit
        uses: actions/checkout@v4

      - name: Download the manifest approved above
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: ${{ github.workspace }}/release-evidence

      - name: Revalidate the approved commit and read image digests
        id: images
        working-directory: .
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY_EOF' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import re

          manifest_path = pathlib.Path('release-evidence/release-manifest.json')
          with manifest_path.open(encoding='utf-8') as handle:
              manifest = json.load(handle)
          if manifest.get('commitSha') != os.environ['EXPECTED_COMMIT']:
              raise SystemExit('manifest commitSha changed before deployment')
          images = manifest.get('images', {})
          required = {
              'api',
              'admin-web',
              'web',
              'notification-service',
              'trading-engine',
              'market-data',
              'execution-engine',
          }
          if set(images) != required:
              raise SystemExit('manifest image set changed before deployment')
          for component, reference in images.items():
              if not isinstance(reference, str) or not re.fullmatch(
                  r'ghcr\.io/[a-z0-9./_-]+@sha256:[a-f0-9]{64}', reference
              ):
                  raise SystemExit(f'{component} is not digest-pinned: {reference!r}')
          for output, component in [
              ('api', 'api'),
              ('admin_web', 'admin-web'),
              ('web', 'web'),
              ('notification_service', 'notification-service'),
          ]:
              print(f'{output}={images[component]}')
          PY_EOF

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize the production Terraform backend
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Create a deployment plan from the approved digests
        run: |
          terraform plan -input=false -out=release.tfplan \
            -var "aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var "api_image=${{ steps.images.outputs.api }}" \
            -var "admin_web_image=${{ steps.images.outputs.admin_web }}" \
            -var "web_image=${{ steps.images.outputs.web }}" \
            -var "notification_service_image=${{ steps.images.outputs.notification_service }}"

      - name: Apply the approved production plan
        run: terraform apply -input=false release.tfplan

      - name: Verify post-deployment health
        if: vars.PRODUCTION_HEALTH_URL != ''
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${{ vars.PRODUCTION_HEALTH_URL }}"; then
              echo
              echo "Production reported healthy after attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo 'Production did not report healthy within five minutes.' >&2
          exit 1
