# Responsibility: gate npm, Python and Rust dependencies; full-history secrets; CodeQL JavaScript/TypeScript and Python analysis; Trivy scans of every shipped runtime image; and release SBOM generation.
name: Security — Dependency Audit, Secret Scanning, CodeQL, Trivy and SBOM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: whitelabel-copytrade

env:
  NODE_VERSION: 22.23.3
  PYTHON_VERSION: '3.11'
  GITLEAKS_VERSION: 8.30.1

jobs:
  secret-scan:
    name: Secret scanning (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks and verify the release checksum
        env:
          GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          archive_path="${RUNNER_TEMP}/${archive}"
          expected_sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

          curl --fail --silent --show-error --location --retry 3 "${archive_url}" --output "${archive_path}"
          printf '%s  %s\n' "${expected_sha256}" "${archive_path}" | sha256sum --check --strict

          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${install_dir}"
          tar --extract --gzip --file "${archive_path}" --directory "${install_dir}" gitleaks
          sudo install --mode 0755 "${install_dir}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan complete Git history with the reviewed policy
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner

  dependency-audit-npm:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: whitelabel-copytrade/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Enforce the reviewed advisory baseline across all workspaces
        run: npm run audit:deps

      - name: Gate high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-audit-python:
    name: Dependency audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit execution-engine, market-data, trading-engine and trading-core
        run: |
          set -euo pipefail
          for manifest in \
            services/execution-engine/requirements.txt \
            services/market-data/requirements.txt \
            services/trading-engine/requirements.txt
          do
            echo "::group::pip-audit ${manifest}"
            python -m pip_audit --requirement "${manifest}" --strict --progress-spinner off
            echo "::endgroup::"
          done
          echo '::group::pip-audit libs/trading-core'
          python -m pip_audit libs/trading-core --strict --progress-spinner off
          echo '::endgroup::'

  dependency-audit-rust:
    name: Dependency audit (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - services/low-latency-gateway
          - packages/sdk-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Audit ${{ matrix.crate }} against the RustSec advisory database
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: whitelabel-copytrade/${{ matrix.crate }}

  codeql:
    name: CodeQL security analysis
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  trivy-image-scan:
    name: Trivy runtime image scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component:
          - api
          - admin-web
          - web
          - notification-service
          - trading-engine
          - market-data
          - execution-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the production runtime image for scanning
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          docker build --pull \
            --target runtime \
            --file "infrastructure/docker/${COMPONENT}.Dockerfile" \
            --tag "wlct-scan/${COMPONENT}:${GITHUB_SHA}" \
            .

      - name: Fail on high or critical OS and library vulnerabilities
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: image
          image-ref: wlct-scan/${{ matrix.component }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sbom:
    name: Generate and validate repository SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: whitelabel-copytrade/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Generate the SPDX SBOM for the installed tree
        uses: anchore/sbom-action@v0
        with:
          path: whitelabel-copytrade
          format: spdx-json
          output-file: whitelabel-copytrade/whitelabel-sbom.spdx.json
          artifact-name: whitelabel-sbom-installed

      - name: Generate and validate the SBOM from committed lockfiles
        run: |
          set -euo pipefail
          node scripts/generate-sbom.mjs \
            --out whitelabel-sbom-repo.spdx.json \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/generate-sbom.mjs --check whitelabel-sbom-repo.spdx.json

      - name: Upload the SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: whitelabel-sbom
          path: |
            whitelabel-copytrade/whitelabel-sbom.spdx.json
            whitelabel-copytrade/whitelabel-sbom-repo.spdx.json
          if-no-files-found: error
          retention-days: 90
